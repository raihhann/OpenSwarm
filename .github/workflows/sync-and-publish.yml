name: Test, Sync & Release

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
    tags:
      - 'master-v*'
      - 'slave-v*'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e "master[demo]" -e slaves/linux build twine
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m build master
      - run: python -m build slaves/linux
      - run: python -m twine check master/dist/* slaves/linux/dist/*

  sync-arduino-branch:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    name: Sync slaves/arduino/SwarmNode -> SwarmNode branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split and push SwarmNode branch + version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Extract version from library.properties
          VERSION=$(grep '^version=' slaves/arduino/SwarmNode/library.properties | cut -d'=' -f2 | tr -d '\r\n')
          echo "Detected SwarmNode version: v${VERSION}"

          # Create commit from slaves/arduino/SwarmNode tree (root has library.properties)
          TREE=$(git rev-parse HEAD:slaves/arduino/SwarmNode)
          COMMIT=$(git commit-tree "$TREE" -m "release(arduino): SwarmNode v${VERSION}")

          # Update SwarmNode branch
          git push origin "$COMMIT:refs/heads/SwarmNode" --force

          # Published versions are immutable. Main can continue changing without
          # silently replacing an installed Arduino release.
          if git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            if [ "$(git rev-parse "v${VERSION}^{tree}")" != "$TREE" ]; then
              echo "::notice::Arduino source changed; bump library version to publish a new release."
            fi
          else
            git tag "v${VERSION}" "$COMMIT"
            git push origin "refs/tags/v${VERSION}"
          fi

  publish-pypi:
    needs: test
    if: startsWith(github.ref, 'refs/tags/master-v') || startsWith(github.ref, 'refs/tags/slave-v')
    name: Publish versioned Python package to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and publish the explicitly tagged package
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::error::PYPI_API_TOKEN is required to publish this release tag."
            exit 1
          fi
          pip install build twine
          if [[ "$RELEASE_TAG" == master-v* ]]; then
            PACKAGE=master
            VERSION="${RELEASE_TAG#master-v}"
          else
            PACKAGE=slaves/linux
            VERSION="${RELEASE_TAG#slave-v}"
          fi
          export PACKAGE VERSION
          python -c 'import os, pathlib, tomllib; p = pathlib.Path(os.environ["PACKAGE"]) / "pyproject.toml"; assert tomllib.loads(p.read_text())["project"]["version"] == os.environ["VERSION"], "Release tag must match package version"'
          python -m build "$PACKAGE"
          twine check "$PACKAGE"/dist/*
          twine upload "$PACKAGE"/dist/*
