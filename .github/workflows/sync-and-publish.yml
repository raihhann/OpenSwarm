name: Sync SwarmNode Branch & Auto-Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-arduino-branch:
    name: Sync slaves/arduino/SwarmNode -> SwarmNode branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split and push SwarmNode branch + version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Extract version from library.properties
          VERSION=$(grep '^version=' slaves/arduino/SwarmNode/library.properties | cut -d'=' -f2 | tr -d '\r\n')
          echo "Detected SwarmNode version: v${VERSION}"

          # Create commit from slaves/arduino/SwarmNode tree (root has library.properties)
          TREE=$(git rev-parse HEAD:slaves/arduino/SwarmNode)
          COMMIT=$(git commit-tree "$TREE" -m "release(arduino): SwarmNode v${VERSION}")

          # Update SwarmNode branch
          git push origin "$COMMIT:refs/heads/SwarmNode" --force

          # Create/update tag v<VERSION> pointing to the Arduino library tree for Arduino Library Manager
          git tag -f "v${VERSION}" "$COMMIT"
          git push origin "refs/tags/v${VERSION}" --force

  publish-pypi:
    name: Publish Master SDK to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and publish Master & Linux Slave to PyPI (if PYPI_API_TOKEN secret is set)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "PYPI_API_TOKEN secret not set yet; skipping PyPI upload."
            exit 0
          fi
          pip install build twine
          python -m build master
          python -m build slaves/linux
          twine upload --skip-existing master/dist/* slaves/linux/dist/*
